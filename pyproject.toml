[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}  # Map the root to "src"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "xvault"
version = "0.1.0"
license = "MIT"
authors = [
  { name="Marc Delos", email="marcdp@dprojects.com" },
]
dependencies = [
    "dprojectstools>=0.0.38",
    "argon2-cffi>=25.1.0",
    "python-dotenv>=1.2.2",
    "keyring>=25.6.0",
    "cryptography>=44.0.0",
    "json5>=0.13.0",
    "PyYAML>=6.0.2"
]
description = "Local-first, Git-friendly encryption for secrets embedded in configuration and Markdown files"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Security :: Cryptography",
]

[project.scripts]
xvault = "xvault.__main__:main"

[project.urls]
Homepage = "https://github.com/marcdp/xvault"
Documentation = "https://github.com/marcdp/xvault#documentation"
Issues = "https://github.com/marcdp/xvault/issues"
Source = "https://github.com/marcdp/xvault"

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
